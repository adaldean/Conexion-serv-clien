<!DOCTYPE html>
<html>
<head>
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>
<body>
    <h1>Editar Usuario</h1>

    <form action="" method="POST">

        <input type="text" name="nombre" value="{{ usuario[1] }}" required><br>
        <input type="text" name="apellido" value="{{ usuario[2] }}" required><br>
        <input type="email" name="correo" value="{{ usuario[3] }}" required><br>
        <input type="text" name="telefono" value="{{ usuario[4] }}" required><br>
        <input type="text" name="direccion" value="{{ usuario[5] }}" required><br>
        <input type="text" name="delegacion" value="{{ usuario[6] }}" required><br>
        <input type="text" name="pais" value="{{ usuario[7] }}" required><br>
        <input type="number" name="edad" value="{{ usuario[8] }}" required><br>

        <button type="submit">Actualizar</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Regresar</a>

</body>
</html>
