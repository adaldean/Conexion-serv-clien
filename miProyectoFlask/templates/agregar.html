<!DOCTYPE html>
<html>
<head>
    <title>Agregar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>
<body>
    <h1>Agregar Usuario</h1>

    <form action="" method="POST">

        <input type="text" name="nombre" placeholder="Nombre" required><br>
        <input type="text" name="apellido" placeholder="Apellido" required><br>
        <input type="email" name="correo" placeholder="Correo" required><br>
        <input type="text" name="telefono" placeholder="Teléfono" required><br>
        <input type="text" name="direccion" placeholder="Dirección" required><br>
        <input type="text" name="delegacion" placeholder="Delegación" required><br>
        <input type="text" name="pais" placeholder="País" required><br>
        <input type="number" name="edad" placeholder="Edad" required><br>

        <button type="submit">Guardar</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Regresar</a>

</body>
</html>
