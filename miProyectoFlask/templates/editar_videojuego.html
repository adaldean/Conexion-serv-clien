<!DOCTYPE html>
<html>
<head>
    <title>Editar Videojuego</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>
<body>
<h1>Editar Videojuego</h1>

<form action="" method="POST">
    <input type="text" name="nombre" value="{{ videojuego[1] }}" required><br>
    <input type="text" name="genero" value="{{ videojuego[2] }}" required><br>
    <input type="number" name="precio" value="{{ videojuego[3] }}" required><br>
    <button type="submit">Actualizar</button>
</form>

<a href="{{ url_for('videojuegos') }}">Regresar</a>
</body>
</html>
